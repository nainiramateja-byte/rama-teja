<html>
    <head>
        <title>table design</title>
        <style>
            table{
               border-collapse:collapse;
               width:100%;
            }
         th,td{
            border:2px solid red;
           padding: 10px;
         text-align:center;
           }
          th {
            background-color: blueviolet;
          }

        </style>


    </head>
    <body>
        <table>
            <tr>
                <th>s.no</th>
                <th>name</th>
                <th>age</th>
                <th>address</th>
            </tr>
            <tr>
                <td>1</td>
                <td>ramu</td>
                <td>23</td>
                <td>kadapa</td>
            </tr>
            <tr>
                <td>2</td>
                <td>mani</td>
                <td>25</td>
                <td>vizag</td>
            </tr>
                    
                
        </table>
    </body>
</html>
